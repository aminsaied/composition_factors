[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "composition-factors"
version = "0.2.0"
description = "Exact SageMath composition factors and portable coefficient data tools"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [{name = "Amin Saied"}]
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[project.scripts]
composition-factors = "compute:entrypoint"

[tool.setuptools]
py-modules = ["composition_factors", "coefficient_data", "compute"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.format]
exclude = ["composition_factors.py"]
